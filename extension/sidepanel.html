<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LLM Vault</title>
  <style>
    @font-face {
      font-family: 'Google Sans';
      src: url('fonts/GoogleSans-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('fonts/GoogleSans-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #F7F5EE;
      --surface: #FFFFFF;
      --surface-inset: #FAF9F5;
      --border: #ECE9DE;
      --separator: #D8D4C4;
      --text-primary: #0A0A0A;
      --text-secondary: #8A8A8A;
      --accent: #0A0A0A;
      --accent-text: #FFFFFF;
      --confirm-accent: #B8874B;
      --confirm-accent-hover: #A3763F;
      --success: #1AA35A;
      --error: #E5484D;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
    }

    .home {
      padding: 4px 4px 18px;
    }

    .home-title {
      font-weight: 700;
      font-size: 15px;
      margin: 0 0 6px;
    }

    .home-body {
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-secondary);
      margin: 0 0 14px;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    .button-row button {
      flex: 1;
      margin-top: 0;
    }

    .is-active-site {
      background: var(--surface-inset);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .is-active-site:hover:not(:disabled) {
      background: var(--surface-inset);
      opacity: 1;
    }

    .home-separator {
      border: none;
      border-top: 1px solid var(--separator);
      margin: 20px 0;
    }

    .provider-nav {
      padding: 0 4px 18px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    #context-message {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    button {
      display: block;
      width: 100%;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button + button { margin-top: 10px; }

    button:hover:not(:disabled) { opacity: 0.85; }

    button:disabled {
      background: var(--surface-inset);
      color: var(--text-secondary);
      border-color: var(--border);
      cursor: not-allowed;
    }

    /* Secondary-style actions: outline instead of solid fill */
    #select-all-recents-btn,
    #cancel-selection-btn,
    #cancel-recents-selection-btn {
      background: var(--surface);
      color: var(--text-primary);
      border-color: var(--border);
    }

    /* Confirm actions: standout accent color, since these commit the selection */
    #confirm-selection-btn,
    #confirm-recents-selection-btn {
      background: var(--confirm-accent);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(184, 135, 75, 0.35);
    }

    #confirm-selection-btn:hover:not(:disabled),
    #confirm-recents-selection-btn:hover:not(:disabled) {
      opacity: 1;
      background: var(--confirm-accent-hover);
    }

    #status {
      margin-top: 14px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-secondary);
      white-space: pre-wrap;
      border-radius: var(--radius-sm);
    }

    #status.error { color: var(--error); }
    #status.success { color: var(--success); }
  </style>
</head>
<body>
  <div class="home">
    <p class="home-title">LLM Vault</p>
    <p class="home-body">
      Turn your Claude and ChatGPT conversations into organized, portable Markdown — projects,
      individual chats, attachments and generated files all included in a single zip. Keep a
      permanent, searchable archive of your work that lives outside any one provider's dashboard.
    </p>
    <div class="button-row">
      <button id="goto-claude-btn" type="button">Open Claude</button>
      <button id="goto-gpt-btn" type="button">Open ChatGPT</button>
    </div>
  </div>
  <hr class="home-separator">
  <div class="provider-nav" id="provider-nav" style="display:none;">
    <div class="button-row">
      <button id="goto-project-btn" type="button">Project</button>
      <button id="goto-conversation-btn" type="button">Conversation</button>
    </div>
  </div>
  <div class="panel">
    <div id="context-message"></div>
    <button id="export-btn" style="display:none;"></button>
    <button id="select-projects-btn" style="display:none;">Select Projects</button>
    <button id="confirm-selection-btn" style="display:none;">Confirm Selection (0)</button>
    <button id="cancel-selection-btn" style="display:none;">Cancel</button>
    <button id="select-recents-btn" style="display:none;">Select Conversations</button>
    <button id="select-all-recents-btn" style="display:none;">Select All</button>
    <button id="confirm-recents-selection-btn" style="display:none;">Confirm Selection (0)</button>
    <button id="cancel-recents-selection-btn" style="display:none;">Cancel</button>
    <div id="status"></div>
  </div>

  <script src="lib/jszip.min.js"></script>
  <script src="lib/orgId.js"></script>
  <script src="lib/api.js"></script>
  <script src="lib/markdown.js"></script>
  <script src="lib/zipBuilder.js"></script>
  <script src="lib/gptDetect.js"></script>
  <script src="lib/gptMarkdown.js"></script>
  <script src="lib/gptExport.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
